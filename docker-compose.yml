services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: logindb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: LoginDb1234
    ports:
      - "${POSTGRES_HOST_PORT:-5437}:5432"
    volumes:
      - login-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d logindb
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: Login.Server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__logindb: Host=postgres;Port=5432;Database=logindb;Username=postgres;Password=LoginDb1234
      Jwt__Issuer: Login.Server
      Jwt__Audience: Login.Frontend
      Jwt__Key: docker-development-secret-key-at-least-32-characters
      Jwt__ExpirationMinutes: 120
      Frontend__AllowedOrigins__0: "http://localhost:${FRONTEND_HOST_PORT:-3002}"
      Frontend__AllowedOrigins__1: "http://127.0.0.1:${FRONTEND_HOST_PORT:-3002}"
    ports:
      - "${SERVER_HOST_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy                                                                                                                                                                                                                                                                                                                                                                                            

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    environment:
      BACKEND_URL: http://server:8080
    ports:
      - "${FRONTEND_HOST_PORT:-3002}:8080"
    depends_on:
      - server

volumes:
  login-postgres-data:
